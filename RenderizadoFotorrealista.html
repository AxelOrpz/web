<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galería de renders fotorrealistas de DiFlow. Visualizaciones arquitectónicas de alta calidad.">
  <title>Galería de Renders - DiFlow</title>
  
  <!-- Preconexión y precarga de recursos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Estilos principales heredados o básicos -->
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden; /* Evita el scroll horizontal */
      background-color: #000; /* Fondo oscuro para que las imágenes resalten */
      font-family: 'Arial', sans-serif; /* Consistencia con tu style.css */
    }

    .gallery-fullscreen-container {
      position: relative; /* Para posicionar el botón de cerrar */
      width: 100vw; /* Ocupa el 100% del ancho del viewport */
      min-height: 100vh; /* Asegura que ocupe al menos la altura de la ventana */
      display: flex;
      flex-direction: column;
      align-items: center; /* Centra el contenido horizontalmente */
      justify-content: center; /* Centra el contenido verticalmente (si no hay desbordamiento) */
      padding: 0; /* Eliminado el padding para que las imágenes toquen los bordes */
      box-sizing: border-box; /* Incluye padding en el ancho/alto */
    }

    .close-button {
      position: fixed; /* Fijo en la pantalla */
      top: 20px;
      right: 30px;
      font-size: 3.5rem; /* Tamaño grande para la X */
      color: #fff; /* Color blanco para la X */
      cursor: pointer;
      text-decoration: none;
      transition: color 0.3s ease, transform 0.3s ease;
      line-height: 1; /* Asegura que la X esté bien centrada verticalmente */
      z-index: 1000; /* Asegura que esté por encima de las imágenes */
      text-shadow: 0 0 10px rgba(0,0,0,0.5); /* Sombra para visibilidad */
    }

    .close-button:hover {
      color: var(--primary-color); /* Color al pasar el ratón */
      transform: scale(1.1);
    }

    .image-grid {
      display: grid;
      /* Por defecto, 3 columnas de igual ancho */
      grid-template-columns: repeat(3, 1fr); 
      gap: 0; /* ¡Clave para eliminar el espacio entre imágenes! */
      width: 100%; /* Ocupa el 100% del ancho de su contenedor padre */
      max-width: 100%; /* Asegura que no se desborde */
      margin: auto; /* Centra la cuadrícula dentro de su contenedor */
      grid-auto-rows: min-content; /* Permite que las filas se ajusten a la altura de su contenido */
      grid-auto-flow: dense; /* ¡Clave para el efecto Tetris! Intenta rellenar huecos */
    }

    .grid-item {
      overflow: hidden; /* Oculta cualquier parte de la imagen que se desborde */
      border-radius: 0; /* Eliminado el border-radius */
      box-shadow: none; /* Eliminado el box-shadow */
      transition: transform 0.3s ease; /* Solo transición de transformación */
      background-color: #222; /* Fondo para evitar flashes blancos al cargar */
    }

    .grid-item:hover {
      transform: scale(1.02); /* Efecto de zoom sutil al pasar el ratón */
      box-shadow: none; /* Asegura que no haya sombra al pasar el ratón */
    }

    .grid-item img {
      width: 100%; /* La imagen ocupa el 100% del ancho de su celda */
      height: auto; /* ¡Clave! La altura se ajusta automáticamente para mantener la proporción original */
      object-fit: cover; /* Recorta la imagen para cubrir completamente la celda, sin dejar espacios vacíos */
      display: block; /* Elimina cualquier espacio extra debajo de la imagen */
      transition: transform 0.4s ease;
    }

    .grid-item:hover img {
      transform: scale(1.08); /* Efecto de zoom al pasar el ratón */
    }

    /* Responsive para la galería */
    @media (max-width: 1024px) {
        .image-grid {
            grid-template-columns: repeat(2, 1fr); /* 2 columnas en tabletas */
        }
    }

    @media (max-width: 768px) {
      .gallery-fullscreen-container {
        padding: 0; /* Eliminado el padding */
      }
      .close-button {
        font-size: 3rem;
        top: 15px;
        right: 20px;
      }
      .image-grid {
        grid-template-columns: 1fr; /* Una columna en móviles para una mejor visualización */
        gap: 0; /* Mantiene sin espacio */
      }
    }

    @media (max-width: 480px) {
        .close-button {
            font-size: 2.5rem;
            top: 10px;
            right: 15px;
        }
    }

    /* Ocultar el footer en esta página si está presente */
    footer {
        display: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="gallery-fullscreen-container">
